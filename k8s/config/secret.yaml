# WebQA Secret - 敏感配置
#
# ⚠️ 注意：此文件仅作为模板，请勿将真实密钥提交到Git
# 生产环境建议：
# 1. 使用 kubectl create secret 命令直接创建
# 2. 使用 External Secrets Operator 从阿里云 KMS 或其他密钥管理服务获取
#
# 创建方式1 - 命令行创建（推荐）:
# kubectl create secret generic webqa-secrets \
#   --namespace=webqa \
#   --from-literal=DATABASE_URL='postgresql+asyncpg://user:password@host:5432/webqa' \
#   --from-literal=REDIS_URL='redis://:password@host:6379/0' \
#   --from-literal=LLM_API_KEY='sk-xxx' \
#   --from-literal=OSS_ACCESS_KEY_ID='xxx' \
#   --from-literal=OSS_ACCESS_KEY_SECRET='xxx'
#
# 创建方式2 - 使用此模板（将值替换为base64编码）:
# echo -n 'your-secret' | base64
#
apiVersion: v1
kind: Secret
metadata:
  name: webqa-secrets
  namespace: cloud-staging
  labels:
    app: webqa
type: Opaque
data:
  # Database URL (base64 encoded)
  # 格式: postgresql+asyncpg://user:password@host:5432/webqa
  DATABASE_URL: ""

  # Redis URL (base64 encoded)
  # 格式: redis://:password@host:6379/0
  REDIS_URL: ""

  # LLM API Key (base64 encoded)
  LLM_API_KEY: ""
