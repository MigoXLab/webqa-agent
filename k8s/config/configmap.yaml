apiVersion: v1
kind: ConfigMap
metadata:
  name: webqa-config
  namespace: cloud-staging
data:
  # Database Configuration (非敏感信息)
  DB_HOST: "pgm-uf6oh577565h59wt.pg.rds.aliyuncs.com"  # 阿里云 Postgre RDS 内网地址
  DB_PORT: "5432"
  DB_NAME: "webqa_be"

  # Redis Configuration (非敏感信息)
  REDIS_HOST: "eng-redis-prod.redis.rds.aliyuncs.com"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  PROGRESS_CACHE_TTL: "43200"
  REDIS_MAX_CONNECTIONS: "50"
  PROGRESS_MAX_LOGS: "1000"

  # LLM Configuration
  LLM_API: "openai"
  LLM_BASE_URL: "http://35.220.164.252:3888/v1"
  LLM_AVAILABLE_MODELS: "gemini-3-flash-preview,gemini-3.1-flash-lite-preview,gpt-5-mini-2025-08-07,qwen3-vl-plus,doubao-seed-2-0-pro-260215,intern-s1-pro"
  LLM_DEFAULT_MODEL: "gemini-3-flash-preview"

  # 按模型配置不同 Base URL（非敏感，放 ConfigMap）
  LLM_BASE_URL_INTERN_S1_PRO: "https://chat.intern-ai.org.cn/api/v1"
  LLM_GEN_MODELS: "gemini-3.1-pro-preview,gemini-3-flash-preview,gpt-5.4,qwen3.5-397b-a17b,doubao-seed-2-0-pro-260215"
  LLM_GEN_DEFAULT_MODEL: "gemini-3.1-pro-preview"
  # Execution Control
  JOB_TIMEOUT_SECONDS: "7200"
  MAX_CONCURRENT_JOBS: "5"
  DEFAULT_WORKERS: "1"
  MAX_WORKERS: "5"

  # Execution Mode
  EXECUTION_MODE: "kubernetes"

  # Shared Storage
  SHARED_STORAGE_PATH: "/shared"
  SHARED_REPORTS_DIR: "reports"
  SHARED_LOGS_DIR: "logs"

  # Backend Callback URL
  BACKEND_CALLBACK_URL: "http://webqa-be:8000"

  # Feishu Webhook (定时任务执行完成后的默认飞书通知地址)
  DEFAULT_FEISHU_WEBHOOK_URL: "https://open.feishu.cn/open-apis/bot/v2/hook/ea37e263-8e8b-4b9a-b98d-cd0b6ad4f4fc"
  FEISHU_WEBHOOK_TIMEOUT_SECONDS: "10"

  # Kubernetes Job Configuration
  K8S_NAMESPACE: "cloud-staging"
  K8S_JOB_IMAGE: "eng-center-registry-vpc.cn-shanghai.cr.aliyuncs.com/qa/webqa-agent:latest"
  K8S_PVC_NAME: "webqa-pvc"
  K8S_JOB_SERVICE_ACCOUNT: "webqa-agent-sa"

  # 高内存业务 (AI 对话等流式渲染场景，每 worker 分配更多内存/CPU)
  # 逗号分隔的 business UUID 列表
  HEAVY_RESOURCE_BUSINESS_IDS: "3ebdd771-d772-496a-8b6a-176ffc88f87a"  # 书生

  # Kubernetes Job 资源按 workers 动态分配 (Chromium --disable-dev-shm-usage，无需 /dev/shm)
  # 标准模式：每 worker 1Gi + 1Gi 基础
  # workers │ CPU        │ 内存
  # 1       │ 2c         │ 2Gi
  # 2       │ 3c         │ 3Gi
  # 3       │ 4c (上限)  │ 4Gi
  #
  # 高内存模式 (HEAVY_RESOURCE_BUSINESS_IDS)：每 worker 2Gi + 2Gi 基础
  # workers │ CPU │ 内存
  # 1       │ 2c  │ 4Gi
  # 2       │ 4c  │ 6Gi
  # 3       │ 6c  │ 8Gi
