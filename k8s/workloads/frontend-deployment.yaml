apiVersion: apps/v1
kind: Deployment
metadata:
  name: webqa-fe
  namespace: cloud-staging
  labels:
    app: webqa-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webqa-fe
  template:
    metadata:
      labels:
        app: webqa-fe
    spec:
      imagePullSecrets:
        - name: regcred-vpc
      containers:
        - name: webqa-fe
          image: eng-center-registry-vpc.cn-shanghai.cr.aliyuncs.com/qa/webqa-fe:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: webqa-fe-svc
  namespace: cloud-staging
spec:
  selector:
    app: webqa-fe
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP  # 如果需要外部访问，可以改为 LoadBalancer 或使用 Ingress
