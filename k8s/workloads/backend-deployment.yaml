apiVersion: apps/v1
kind: Deployment
metadata:
  name: webqa-be
  namespace: cloud-staging
  labels:
    app: webqa-be
spec:
  replicas: 1
  # strategy:
  #   type: Recreate  # 使用 Recreate 策略避免 RWO PVC 多挂载问题
  selector:
    matchLabels:
      app: webqa-be
  template:
    metadata:
      labels:
        app: webqa-be
    spec:
      serviceAccountName: webqa-be-sa
      imagePullSecrets:
        - name: regcred-vpc
      containers:
        - name: webqa-be
          image: eng-center-registry-vpc.cn-shanghai.cr.aliyuncs.com/qa/webqa-be:latest  # CI/CD 过程中会被替换
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          # 使用 ConfigMap 获取非敏感配置
          envFrom:
            - configMapRef:
                name: webqa-config
            # 使用 Secret 获取敏感配置
            - secretRef:
                name: webqa-secrets
          volumeMounts:
            - name: shared-storage
              mountPath: /shared
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            # limits:
            #   cpu: "1"
            #   memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: webqa-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: webqa-be
  namespace: cloud-staging
spec:
  selector:
    app: webqa-be
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
