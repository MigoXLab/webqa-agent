# --- Deploy Stage: Public prod ---

deploy-be-prod:
  stage: deploy
  retry: 2
  tags:
    - ecs
  image: eng-center-registry.cn-shanghai.cr.aliyuncs.com/public/dtzar/helm-kubectl
  script:
    - echo "Deploying webqa-be"
    # - echo "kubeconfig path:" "$kubeconfig_prod_public_webqa"
    # - test -f "$kubeconfig_prod_public_webqa" && echo "kubeconfig file exists" || echo "ERROR kubeconfig file NOT found"
    # Apply Dependencies (ConfigMap, Secret, PVC, RBAC)
    - kubectl --kubeconfig "$kubeconfig_prod_public_webqa" apply -f k8s/config/configmap.yaml
    - kubectl --kubeconfig "$kubeconfig_prod_public_webqa" apply -f k8s/config/secret.yaml
    # - kubectl --kubeconfig "$kubeconfig_prod_public_webqa" apply -f k8s/storage/pvc.yaml
    # - kubectl --kubeconfig "$kubeconfig_prod_public_webqa" apply -f k8s/rbac.yaml
    # Deploy Backend
    - cd k8s/workloads
    - sed -i "s/_tag/$CI_COMMIT_SHORT_SHA/g" backend-deployment.yaml
    - kubectl --kubeconfig "$kubeconfig_prod_public_webqa" apply -f backend-deployment.yaml
    # 重启 Backend Pod 以加载最新 ConfigMap (如果有变化)
    # - kubectl --kubeconfig "$kubeconfig_prod_public_webqa" rollout restart deployment/webqa-be -n cloud-staging
    - echo "Backend successfully deployed."
  rules:
    # 支持手动触发
    - if: '$CI_COMMIT_BRANCH =~ /^release.*$/'
      when: manual
      allow_failure: true

deploy-fe-prod:
  stage: deploy
  retry: 2
  tags:
    - ecs
  image: eng-center-registry.cn-shanghai.cr.aliyuncs.com/public/dtzar/helm-kubectl
  script:
    - echo "Deploying webqa-fe"
    # Deploy Frontend
    - cd k8s/workloads
    - sed -i "s/_tag/$CI_COMMIT_SHORT_SHA/g" frontend-deployment.yaml
    - kubectl --kubeconfig "$kubeconfig_prod_public_webqa" apply -f frontend-deployment.yaml
    # Apply Ingress
    # - cd ../network
    # - kubectl --kubeconfig "$kubeconfig_prod_public_webqa" apply -f ingress.yaml
    - echo "Frontend successfully deployed."
  rules:
    # 支持手动触发
    - if: '$CI_COMMIT_BRANCH =~ /^release.*$/'
      when: manual
      allow_failure: true

# --- PR Agent Stage ---
coderiva_job:
  stage: pr_agent
  retry: 2
  tags:
    - ecs
  image:
    name: eng-center-registry.cn-shanghai.cr.aliyuncs.com/qa/coderiva:latest
    entrypoint: [""]
  variables:
    CONFIG__GIT_PROVIDER: "gitlab"
    CONFIG__RESPONSE_LANGUAGE: "zh-CN"
    CONFIG__AI_TIMEOUT: "600"
    CONFIG__MODEL: "openai/gemini-3.5-flash"
    CONFIG__MAX_MODEL_TOKENS: "200000"
    PR_AGENT_COMMANDS: '["/describe", "/review", "/improve"]'
    PR_AGENT_DATABASE__USER: "coderiva"
    PR_AGENT_DATABASE__NAME: "coderiva"
  script:
    - cd /app
    - export MR_URL="${CI_MERGE_REQUEST_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID}"
    - export GITLAB__PERSONAL_ACCESS_TOKEN="${GITLAB_PERSONAL_ACCESS_TOKEN}"
    - export OPENAI__KEY="${OPENAI_KEY}"
    - export OPENAI__API_BASE="${OPENAI_API_BASE}/v1"
    - export ANTHROPIC__KEY="${OPENAI_KEY}"
    - export ANTHROPIC__API_BASE="${OPENAI_API_BASE}"
    - export AUDIT_DB_ENABLED=false
    # - export PR_AGENT_DATABASE__HOST="${AUDIT_DB_HOST}"
    # - export PR_AGENT_DATABASE__PASSWORD="${AUDIT_DB_PASSWORD}"
    - python -m pr_agent.servers.gitlab_ci_audit_runner
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
