stages:
  - build
  - deploy
  - pr_agent

variables:
  DOCKER_DRIVER: overlay2
  PROJECT: qa
  SERVICE_NAME_BACKEND: webqa-be
  SERVICE_NAME_FRONTEND: webqa-fe
  SERVICE_NAME_AGENT: webqa-agent

  # 镜像 Tag 格式: harbor_url/project/service:tag
  # 注意：需要在 GitLab CI/CD Variables 中配置:
  # - harbor_url_prod_vpc
  # - harbor_user
  # - harbor_password
  # - kubeconfig_dev_puyu

# --- Build Stage ---

build-backend:
  stage: build
  image: eng-center-registry.cn-shanghai.cr.aliyuncs.com/public/docker-git:latest
  retry: 2
  tags:
    - ecs
  before_script:
    - echo $harbor_url_prod_vpc $harbor_user $harbor_password
    - docker login $harbor_url_prod_vpc -u $harbor_user -p $harbor_password
  script:
    - echo "Build Backend"
    # 在根目录构建，使用 backend/Dockerfile，这样可以访问 webqa_agent/
    - docker build --pull -t $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_BACKEND:$CI_COMMIT_SHORT_SHA -f backend/Dockerfile .
    - docker push $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_BACKEND:$CI_COMMIT_SHORT_SHA
    # 同时推送 latest 标签
    - docker tag $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_BACKEND:$CI_COMMIT_SHORT_SHA $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_BACKEND:latest
    - docker push $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_BACKEND:latest
    - docker rmi $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_BACKEND:$CI_COMMIT_SHORT_SHA $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_BACKEND:latest
  rules:
    # # 当 backend 或 webqa_agent 代码变化时自动触发
    # - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH =~ /^dev_.*$/'
    #   changes:
    #     - backend/**/*
    #     - webqa_agent/**/*
    #   when: on_success
    # 支持手动触发
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH =~ /^dev_.*$/'
      when: manual
      allow_failure: true

build-frontend:
  stage: build
  image: eng-center-registry.cn-shanghai.cr.aliyuncs.com/public/docker-git:latest
  retry: 2
  tags:
    - ecs
  before_script:
    - echo $harbor_url_prod_vpc $harbor_user $harbor_password
    - docker login $harbor_url_prod_vpc -u $harbor_user -p $harbor_password
  script:
    - echo "Build Frontend"
    - docker build --pull -t $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_FRONTEND:$CI_COMMIT_SHORT_SHA -f frontend/Dockerfile .
    - docker push $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_FRONTEND:$CI_COMMIT_SHORT_SHA
    # 同时推送 latest 标签
    - docker tag $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_FRONTEND:$CI_COMMIT_SHORT_SHA $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_FRONTEND:latest
    - docker push $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_FRONTEND:latest
    - docker rmi $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_FRONTEND:$CI_COMMIT_SHORT_SHA $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_FRONTEND:latest
  rules:
    # # 当 frontend 代码变化时自动触发
    # - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH =~ /^dev_.*$/'
    #   changes:
    #     - frontend/**/*
    #   when: on_success
    # 支持手动触发
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH =~ /^dev_.*$/'
      when: manual
      allow_failure: true

build-agent:
  stage: build
  image: eng-center-registry.cn-shanghai.cr.aliyuncs.com/public/docker-git:latest
  retry: 2
  tags:
    - ecs
  before_script:
    - echo $harbor_url_prod_vpc $harbor_user $harbor_password
    - docker login $harbor_url_prod_vpc -u $harbor_user -p $harbor_password
  script:
    - echo "Build Agent"
    # 在根目录构建，使用 webqa_agent/Dockerfile，这样可以访问 backend/ 和 webqa_agent/
    - docker build --pull -t $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_AGENT:$CI_COMMIT_SHORT_SHA -f Dockerfile .
    - docker push $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_AGENT:$CI_COMMIT_SHORT_SHA
    # 同时推送 latest 标签，供 K8s Job 使用
    - docker tag $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_AGENT:$CI_COMMIT_SHORT_SHA $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_AGENT:latest
    - docker push $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_AGENT:latest
    - docker rmi $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_AGENT:$CI_COMMIT_SHORT_SHA $harbor_url_prod_vpc/$PROJECT/$SERVICE_NAME_AGENT:latest
  rules:
    # 支持手动触发
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH =~ /^dev_.*$/'
      when: manual
      allow_failure: true


